<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0751b2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>バラ在庫計算</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=4"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#e6f5ff,#f7fbff);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#123458;min-height:100dvh}.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 40px}.head{display:flex;align-items:center;gap:14px;margin-bottom:28px}.head img{width:66px;height:66px;border-radius:17px;box-shadow:0 6px 15px #154c8b30}.head h1{font-size:25px;margin:0 0 4px}.head p{margin:0;color:#65819b;font-size:13px}.panel{background:white;border-radius:25px;padding:23px;box-shadow:0 12px 34px #1c64931b;border:1px solid #e1effa}.field{margin-bottom:20px}.field label{display:block;font-weight:750;margin-bottom:9px;font-size:15px}.field input{width:100%;font-size:30px;font-weight:750;border:2px solid #dceaf5;border-radius:16px;padding:14px 16px;color:#123b72;background:#f8fcff;outline:none}.field input:focus{border-color:#1886ec}.result{margin-top:23px;background:linear-gradient(145deg,#0768ce,#073c9c);border-radius:22px;padding:24px;text-align:center;color:white}.result .caption{font-size:15px;opacity:.9}.result .number{font-size:76px;font-weight:850;line-height:1.3;letter-spacing:-3px}.result .unit{font-size:20px;font-weight:700}.sub{display:flex;gap:12px;margin-top:14px}.mini{flex:1;text-align:center;border-radius:16px;background:#eef7ff;padding:17px 5px}.mini span{display:block;color:#5e7993;font-size:12px}.mini strong{display:block;font-size:24px;margin-top:7px}.reset{width:100%;margin-top:22px;border:1px solid #c4dcf2;border-radius:14px;background:white;color:#235a8e;padding:15px;font-size:16px;font-weight:700}.hint{text-align:center;color:#7690a6;font-size:12px;margin-top:18px}.error{color:#b32a2a;font-size:13px;min-height:18px;margin-top:6px}
/* Standalone calculator */
.calculator{margin-top:22px;padding:20px}.calc-heading{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;margin:0 0 14px;color:#103d7a}.calc-heading svg{width:26px;height:26px}.calc-screen{background:linear-gradient(135deg,#f3faff,#e4f2fc);border:2px solid #c5def0;border-radius:17px;padding:17px 16px;text-align:right;min-height:91px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.calc-expression{min-height:18px;font-size:12px;color:#6483a0}.calc-value{font-size:38px;font-weight:750;color:#102c53;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:13px}.calc-key{min-width:0;min-height:61px;border-radius:14px;border:1px solid #c6d9e9;background:linear-gradient(#fff,#eef7ff);box-shadow:0 3px 0 #bfd3e4;color:#123d7c;font-size:26px;font-weight:750;touch-action:manipulation;cursor:pointer}.calc-key:active{transform:translateY(2px);box-shadow:0 1px 0 #bfd3e4}.calc-key.utility{background:linear-gradient(#eaf6ff,#cde9ff);font-size:20px}.calc-key.op{background:linear-gradient(#168ee5,#0754b5);color:white;border-color:#06499b;box-shadow:0 3px 0 #053d83}.calc-key.equals{background:linear-gradient(#ffad2c,#f18a00);color:white;border-color:#dc7b00;box-shadow:0 3px 0 #ba6900}.calc-key.zero{grid-column:span 2}.calc-note{font-size:12px;color:#708da6;margin:12px 0 0;text-align:center}@media(max-width:380px){.app{padding-left:13px;padding-right:13px}.calculator{padding:15px}.calc-key{min-height:55px}.calc-grid{gap:7px}}
.voice-panel{margin-top:20px;padding:19px;border:1px solid #cfe5f8;border-radius:19px;background:linear-gradient(145deg,#f4fbff,#e8f5ff)}.voice-title{font-size:18px;font-weight:800;margin:0 0 8px;color:#104c89}.voice-example{font-size:14px;color:#50748e;margin:0 0 13px}.voice-btn{width:100%;border:0;border-radius:15px;padding:17px 12px;background:linear-gradient(145deg,#1596ee,#0752b5);color:white;font-weight:800;font-size:18px;box-shadow:0 4px 0 #073f8a;touch-action:manipulation}.voice-btn:active{transform:translateY(2px)}.voice-btn.listening{background:linear-gradient(145deg,#ec6161,#c32143);box-shadow:0 4px 0 #92132e}.voice-status{font-size:13px;color:#345e7c;min-height:20px;margin:12px 0 7px}.voice-fallback{display:flex;gap:8px}.voice-fallback input{min-width:0;width:100%;border:2px solid #cfe1f1;border-radius:12px;padding:11px;font-size:17px;background:white}.voice-fallback button{border:0;border-radius:12px;padding:0 16px;color:white;background:#1268c7;font-weight:800;white-space:nowrap}.voice-note{font-size:12px;line-height:1.5;color:#63819a;margin:10px 0 0}
</style></head><body><main class="app"><header class="head"><img src="icon-192.png?v=4" alt="ロゴ"><div><h1>バラ在庫計算</h1><p>在庫と入数から、バラを瞬時に計算</p></div></header><section class="panel"><div class="field"><label for="stock">現在の在庫数（個）</label><input id="stock" type="number" min="0" step="1" inputmode="numeric" placeholder="例：100" value="100"></div><div class="field"><label for="caseSize">1ケースの入数（個）</label><input id="caseSize" type="number" min="1" step="1" inputmode="numeric" placeholder="例：30" value="30"></div><div id="error" class="error" role="status"></div><div class="result" aria-live="polite"><div class="caption">バラ在庫数</div><div><span id="loose" class="number">10</span><span class="unit"> 個</span></div></div><div class="sub"><div class="mini"><span>満ケース数</span><strong id="cases">3 ケース</strong></div><div class="mini"><span>ケース内のバラ</span><strong id="remainder">10 個</strong></div></div><div class="voice-panel"><h2 class="voice-title">🎙 音声で在庫入力</h2><p class="voice-example">「100の30」と話すだけで自動計算</p><button type="button" id="voiceButton" class="voice-btn">🎤 話して入力</button><p id="voiceStatus" class="voice-status" role="status" aria-live="polite">マイクを押して「100の30」と話してください</p><div class="voice-fallback"><input id="voiceText" type="text" inputmode="text" autocomplete="off" aria-label="100の30形式で入力" placeholder="100の30"><button type="button" id="voiceApply">反映</button></div><p class="voice-note">音声認識が使えない場合は、上の欄でiPhoneキーボードのマイクを使うか、直接入力できます。</p></div><button class="reset" id="reset">↻ 入力をクリア</button></section><section class="panel calculator" aria-label="通常の電卓"><h2 class="calc-heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 7h8M8 12h2m4 0h2m-8 4h2m4 0h2"/></svg>電卓</h2><div class="calc-screen" aria-live="polite"><div class="calc-expression" id="calcExpression"></div><div class="calc-value" id="calcDisplay">0</div></div><div class="calc-grid" id="calcKeys"><button type="button" class="calc-key utility" data-key="AC">AC</button><button type="button" class="calc-key utility" data-key="sign">±</button><button type="button" class="calc-key utility" data-key="back">⌫</button><button type="button" class="calc-key op" data-key="/">÷</button><button type="button" class="calc-key" data-key="7">7</button><button type="button" class="calc-key" data-key="8">8</button><button type="button" class="calc-key" data-key="9">9</button><button type="button" class="calc-key op" data-key="*">×</button><button type="button" class="calc-key" data-key="4">4</button><button type="button" class="calc-key" data-key="5">5</button><button type="button" class="calc-key" data-key="6">6</button><button type="button" class="calc-key op" data-key="-">−</button><button type="button" class="calc-key" data-key="1">1</button><button type="button" class="calc-key" data-key="2">2</button><button type="button" class="calc-key" data-key="3">3</button><button type="button" class="calc-key op" data-key="+">+</button><button type="button" class="calc-key zero" data-key="0">0</button><button type="button" class="calc-key" data-key=".">.</button><button type="button" class="calc-key equals" data-key="=">=</button></div><p class="calc-note">在庫計算とは独立した電卓です</p></section><p class="hint">入力すると自動で計算されます · オフライン対応</p></main><script>const stock=document.querySelector('#stock'),size=document.querySelector('#caseSize'),loose=document.querySelector('#loose'),cases=document.querySelector('#cases'),remainder=document.querySelector('#remainder'),error=document.querySelector('#error');function calc(){const a=Number(stock.value),b=Number(size.value);if(stock.value===''||size.value===''){error.textContent='';loose.textContent='—';cases.textContent='—';remainder.textContent='—';return}if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<0||b<=0){error.textContent='在庫は0以上、入数は1以上の整数で入力してください';loose.textContent='—';cases.textContent='—';remainder.textContent='—';return}error.textContent='';const r=a%b;loose.textContent=r.toLocaleString('ja-JP');cases.textContent=Math.floor(a/b).toLocaleString('ja-JP')+' ケース';remainder.textContent=r.toLocaleString('ja-JP')+' 個'}stock.addEventListener('input',calc);size.addEventListener('input',calc);document.querySelector('#reset').addEventListener('click',()=>{stock.value='';size.value='';calc();stock.focus()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));calc();
// Speech-to-text: first integer is total stock; second is case size.
(()=>{
 const btn=document.getElementById('voiceButton'),status=document.getElementById('voiceStatus'),input=document.getElementById('voiceText');
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 let recognizer=null, listening=false;
 const kanjiDigits={'零':0,'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
 const smallUnits={'十':10,'百':100,'千':1000};
 function japaneseNumber(token){
  token=token.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/,/g,'');
  if(/^\d+$/.test(token))return Number(token);
  if(!/^[零〇一二三四五六七八九十百千万億]+$/.test(token))return NaN;
  function under10000(t){let result=0,pending=0;for(const c of t){if(c in kanjiDigits)pending=kanjiDigits[c];else if(c in smallUnits){result+=(pending||1)*smallUnits[c];pending=0}else return NaN}return result+pending}
  let total=0;for(const [unit,mult] of [['億',100000000],['万',10000]]){if(token.includes(unit)){const parts=token.split(unit);if(parts.length!==2)return NaN;const n=parts[0]?under10000(parts[0]):1;if(!Number.isFinite(n))return NaN;total+=n*mult;token=parts[1]}}
  return total+under10000(token);
 }
 function parsePhrase(raw){
  let t=raw.normalize('NFKC').replace(/[\s、，,。．.]/g,'').replace(/個|ケース|在庫|入数|入り数|いりすう|は|です|だよ/g,'');
  t=t.replace(/ノ|乃/g,'の');
  const parts=t.split('の');if(parts.length!==2||!parts[0]||!parts[1])return null;
  const a=japaneseNumber(parts[0]),b=japaneseNumber(parts[1]);
  if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<0||b<=0)return null;
  return [a,b];
 }
 function applyPhrase(t){const parsed=parsePhrase(t);if(!parsed){status.textContent='認識できませんでした。「100の30」の形で入力してください（入数は1以上）。';return false}stock.value=String(parsed[0]);size.value=String(parsed[1]);calc();input.value=`${parsed[0]}の${parsed[1]}`;status.textContent=`認識：${parsed[0]}の${parsed[1]} → バラ ${parsed[0]%parsed[1]} 個`;return true}
 document.getElementById('voiceApply').addEventListener('click',()=>applyPhrase(input.value));input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyPhrase(input.value)}});
 if(!SpeechRecognition){status.textContent='この環境ではマイクによる直接認識に対応していません。下の欄とキーボード音声入力をご利用ください。';btn.disabled=true;btn.style.opacity='.5';return}
 btn.addEventListener('click',()=>{
  if(listening){recognizer&&recognizer.stop();return}
  try{recognizer=new SpeechRecognition();recognizer.lang='ja-JP';recognizer.interimResults=false;recognizer.continuous=false;recognizer.maxAlternatives=3;
   recognizer.onstart=()=>{listening=true;btn.classList.add('listening');btn.textContent='■ 認識を終了';status.textContent='聞き取り中…「100の30」と話してください'};
   recognizer.onresult=e=>{let ok=false;for(let i=0;i<e.results[0].length;i++){const t=e.results[0][i].transcript;if(applyPhrase(t)){ok=true;break}}if(!ok){input.value=e.results[0][0].transcript;status.textContent='「'+input.value+'」と認識しました。数字を確認して反映してください。'}};
   recognizer.onerror=e=>{const messages={'not-allowed':'マイクの使用が許可されていません。Safariのマイク設定をご確認ください。','no-speech':'音声が聞き取れませんでした。もう一度お試しください。','network':'音声認識の通信に失敗しました。文字入力をご利用ください。','audio-capture':'マイクを利用できません。'};status.textContent=messages[e.error]||'音声認識に失敗しました。文字入力をご利用ください。'};
   recognizer.onend=()=>{listening=false;btn.classList.remove('listening');btn.textContent='🎤 話して入力'};
   recognizer.start();
  }catch(e){status.textContent='音声認識を開始できません。文字入力をご利用ください。'}
 });
})();
// Ordinary calculator: deliberately independent of stock and case-size inputs.
(()=>{const display=document.getElementById('calcDisplay'),expression=document.getElementById('calcExpression');let current='0',stored=null,op=null,newEntry=false,justEqual=false;const ops={'+':'+','-':'−','*':'×','/':'÷'};const pretty=n=>{if(!Number.isFinite(n))return 'エラー';return String(Number(n.toPrecision(12)))};const render=()=>{display.textContent=current;expression.textContent=stored!==null&&op!==null?`${pretty(stored)} ${ops[op]}`:''};const compute=(a,b,o)=>o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:o==='/'?a/b:b;function press(key){if(key==='AC'){current='0';stored=null;op=null;newEntry=false;justEqual=false;render();return}if(current==='エラー'&&!/^[0-9.]$/.test(key)){if(key==='back')press('AC');return}if(/^\d$/.test(key)){if(newEntry||justEqual||current==='エラー'){current=key;newEntry=false;justEqual=false}else if(current.replace(/[^0-9]/g,'').length<12){current=current==='0'?key:current==='-0'?'-'+key:current+key}render();return}if(key==='.'){if(newEntry||justEqual||current==='エラー'){current='0.';newEntry=false;justEqual=false}else if(!current.includes('.'))current+='.';render();return}if(key==='sign'){if(current!=='エラー'&&Number(current)!==0)current=current.startsWith('-')?current.slice(1):'-'+current;render();return}if(key==='back'){if(newEntry||justEqual){current='0';newEntry=false;justEqual=false}else current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1);render();return}if(['+','-','*','/'].includes(key)){if(op!==null&&stored!==null&&!newEntry){const result=compute(stored,Number(current),op);current=pretty(result);stored=Number(current);if(current==='エラー'){op=null;stored=null;render();return}}stored=Number(current);op=key;newEntry=true;justEqual=false;render();return}if(key==='='&&op!==null&&stored!==null){current=pretty(compute(stored,Number(current),op));stored=null;op=null;newEntry=false;justEqual=true;render()}}document.getElementById('calcKeys').addEventListener('click',e=>{const btn=e.target.closest('button[data-key]');if(btn)press(btn.dataset.key)});render()})();
</script></body></html>
