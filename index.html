<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0751b2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>バラ在庫計算</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#e6f5ff,#f7fbff);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#123458;min-height:100dvh}.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 40px}.head{display:flex;align-items:center;gap:14px;margin-bottom:28px}.head img{width:66px;height:66px;border-radius:17px;box-shadow:0 6px 15px #154c8b30}.head h1{font-size:25px;margin:0 0 4px}.head p{margin:0;color:#65819b;font-size:13px}.panel{background:white;border-radius:25px;padding:23px;box-shadow:0 12px 34px #1c64931b;border:1px solid #e1effa}.field{margin-bottom:20px}.field label{display:block;font-weight:750;margin-bottom:9px;font-size:15px}.field input{width:100%;font-size:30px;font-weight:750;border:2px solid #dceaf5;border-radius:16px;padding:14px 16px;color:#123b72;background:#f8fcff;outline:none}.field input:focus{border-color:#1886ec}.result{margin-top:23px;background:linear-gradient(145deg,#0768ce,#073c9c);border-radius:22px;padding:24px;text-align:center;color:white}.result .caption{font-size:15px;opacity:.9}.result .number{font-size:76px;font-weight:850;line-height:1.3;letter-spacing:-3px}.result .unit{font-size:20px;font-weight:700}.sub{display:flex;gap:12px;margin-top:14px}.mini{flex:1;text-align:center;border-radius:16px;background:#eef7ff;padding:17px 5px}.mini span{display:block;color:#5e7993;font-size:12px}.mini strong{display:block;font-size:24px;margin-top:7px}.reset{width:100%;margin-top:22px;border:1px solid #c4dcf2;border-radius:14px;background:white;color:#235a8e;padding:15px;font-size:16px;font-weight:700}.hint{text-align:center;color:#7690a6;font-size:12px;margin-top:18px}.error{color:#b32a2a;font-size:13px;min-height:18px;margin-top:6px}</style></head><body><main class="app"><header class="head"><img src="icon-192.png" alt="ロゴ"><div><h1>バラ在庫計算</h1><p>在庫と入数から、バラを瞬時に計算</p></div></header><section class="panel"><div class="field"><label for="stock">現在の在庫数（個）</label><input id="stock" type="number" min="0" step="1" inputmode="numeric" placeholder="例：100" value="100"></div><div class="field"><label for="caseSize">1ケースの入数（個）</label><input id="caseSize" type="number" min="1" step="1" inputmode="numeric" placeholder="例：30" value="30"></div><div id="error" class="error" role="status"></div><div class="result" aria-live="polite"><div class="caption">バラ在庫数</div><div><span id="loose" class="number">10</span><span class="unit"> 個</span></div></div><div class="sub"><div class="mini"><span>満ケース数</span><strong id="cases">3 ケース</strong></div><div class="mini"><span>ケース内のバラ</span><strong id="remainder">10 個</strong></div></div><button class="reset" id="reset">↻ 入力をクリア</button></section><p class="hint">入力すると自動で計算されます · オフライン対応</p></main><script>const stock=document.querySelector('#stock'),size=document.querySelector('#caseSize'),loose=document.querySelector('#loose'),cases=document.querySelector('#cases'),remainder=document.querySelector('#remainder'),error=document.querySelector('#error');function calc(){const a=Number(stock.value),b=Number(size.value);if(stock.value===''||size.value===''){error.textContent='';loose.textContent='—';cases.textContent='—';remainder.textContent='—';return}if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<0||b<=0){error.textContent='在庫は0以上、入数は1以上の整数で入力してください';loose.textContent='—';cases.textContent='—';remainder.textContent='—';return}error.textContent='';const r=a%b;loose.textContent=r.toLocaleString('ja-JP');cases.textContent=Math.floor(a/b).toLocaleString('ja-JP')+' ケース';remainder.textContent=r.toLocaleString('ja-JP')+' 個'}stock.addEventListener('input',calc);size.addEventListener('input',calc);document.querySelector('#reset').addEventListener('click',()=>{stock.value='';size.value='';calc();stock.focus()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));calc();</script></body></html>
